name: Feature request
description: Propose a focused product or engineering improvement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Explain the need before describing a solution.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should become measurably better?
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Possible approach
  - type: textarea
    id: risks
    attributes:
      label: Privacy, safety, and operational considerations
      description: Note consent, data, moderation, AI, migration, or rollback implications.
